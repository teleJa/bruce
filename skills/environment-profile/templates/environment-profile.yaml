# Static, reusable Environment Profile. New profiles are unconfirmed by default.
version: 1
profile_kind: environment
profile_id: null
profile_revision: 1
content_hash: sha256:pending
profile_state: draft
confirmation:
  state: pending
  confirmed_by: null
  confirmed_at: null
  confirmed_revision: null
  confirmed_content_hash: null

declaration:
  source: user
  statement: null
  provided_at: null

project:
  name: null
  root: null

environment:
  name: null
  kind: null
  production: false
  shared: false
  purposes: []
  purpose: null
  allowed_operations: []
  prohibited_operations: []

facts: []
unresolved_facts: []

local_env:
  path: .env
  required: false
  ignored_by_vcs: required
  file_mode: "0600"
  required_variables: []

build:
  strategy: null
  executor: null
  working_directory: null
  operations: []
  artifact_expectations: []
  trigger:
    method: null
    authorization_required: true
  terminal_states: [success, failed, canceled, unknown]
  required_evidence: []
  invariants:
    - trigger-accepted-is-not-build-success

deployment:
  mode: null
  owner: null
  strategy: null
  executor: null
  application_services: []
  targets: []
  terminal_states: [deployed, failed, rolled_back, unknown]
  required_evidence: []
  invariants:
    - build-success-is-not-deployment-success
    - deployment-success-is-not-user-verification

lifecycle:
  prepare: []
  start: []
  stop: []
  status: []
  logs: []

dependencies: []
network:
  access_scope: null
  endpoints: []
identities: []
data_policy: {}
configuration: {}
operations: []

account_pools: []
credentials: []
capabilities: []
preflight: []

freshness:
  basis: user-declaration-and-selected-reference-revisions
  invalidate_on:
    - user-declaration-change
    - environment-scope-change
    - endpoint-change
    - account-policy-change
    - credential-source-change
    - selected-capability-change
    - local-env-variable-scope-change
    - local-env-security-change
    - topology-change
  revalidation_required: true

security:
  persist_secrets: false
  expose_secrets_to_model: false
  redact_logs: true
  credential_values_allowed: false
  credential_refs_only: true

confirmation_summary:
  unresolved_questions: []
  user_must_confirm:
    - profile-identity-and-revision
    - environment-scope-and-safety
    - user-declaration-and-user-facts
    - environment-topology-and-operation-boundaries
    - build-and-deployment-path
    - accounts-and-credential-references
    - skills-and-preflight
    - freshness-and-security-policy
