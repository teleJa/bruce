    path: tasks/T-001-freeze-profile-lifecycle.md
    depends_on: []
    acceptance_ids: [AC-001, AC-005, AC-006, AC-008, AC-009]
    allowed_paths:
      - skills/bruce/references/profile-lifecycle.md
      - skills/bruce/references/profile-security.md
