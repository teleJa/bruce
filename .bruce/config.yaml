# Bruce workspace artifact configuration.
version: 1
artifacts:
  root: docs/change

verification:
  # Browser provider used for user-visible Web interaction and visual evidence.
  # Supported values: ego-lite, chrome. Default: ego-lite.
  browser_provider: ego-lite

workflow:
  # Repair budgets read by Bruce; the initial Completion scan is round 0.
  repair_loop:
    # Overall Completion repair rounds (1-10).
    max_rounds: 10
    # Complete repair-and-reverify rounds for one failure, across phases (1-5).
    max_rounds_per_failure: 5
  # Async reviewer lifecycle. Stop polling after bounded no-progress waits.
  review:
    max_wait_seconds: 60
    max_no_progress_polls: 2
