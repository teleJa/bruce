<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>声纹工坊 · 音频克隆原型</title>
  <style>
    :root{--ink:#18212f;--muted:#667085;--line:#e4e8ef;--brand:#5b4bdb;--brand-dark:#4435bd;--soft:#f5f6ff;--good:#087443;--bad:#b42318;--shadow:0 18px 48px #25315b14}
    *{box-sizing:border-box} body{margin:0;background:#f7f8fb;color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif}
    .shell{max-width:1080px;margin:auto;padding:32px 20px 56px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:32px}.brand{font-weight:800;letter-spacing:-.02em;font-size:20px}.badge{color:var(--brand);background:#eceaff;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700}
    .hero{margin-bottom:24px}.hero h1{font-size:clamp(28px,5vw,44px);line-height:1.08;margin:0 0 10px;letter-spacing:-.04em}.hero p{color:var(--muted);max-width:650px;margin:0}
    .grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr);gap:20px}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow)}.card h2{font-size:18px;margin:0 0 18px}.field{margin-top:18px}.field label{display:block;font-weight:700;margin-bottom:7px}.hint{font-size:12px;color:var(--muted);margin-top:5px}.input,select{width:100%;border:1px solid #d5dae3;border-radius:10px;padding:11px 12px;font:inherit;color:var(--ink);background:#fff}.input:focus,select:focus{outline:3px solid #dcd9ff;border-color:var(--brand)}
    .drop{border:1.5px dashed #aeb5c5;background:#fafbff;border-radius:14px;padding:24px;text-align:center;cursor:pointer;transition:.2s}.drop:hover,.drop:focus-within{border-color:var(--brand);background:var(--soft)}.drop strong{display:block;margin-bottom:4px}.drop small{color:var(--muted)}.drop input{display:none}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.actions{display:flex;gap:12px;align-items:center;margin-top:24px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 17px;font:700 14px inherit;cursor:pointer;min-height:44px}.primary{background:var(--brand);color:white}.primary:hover{background:var(--brand-dark)}.secondary{background:#f0f1f5;color:var(--ink)}.btn:disabled{opacity:.6;cursor:wait}.status{margin-top:20px;padding:13px 14px;border-radius:11px;background:#f5f6f8;color:var(--muted);min-height:48px}.status.good{background:#ecfdf3;color:var(--good)}.status.bad{background:#fff1f0;color:var(--bad)}
    .result{display:flex;flex-direction:column;gap:16px}.voice{display:flex;align-items:center;gap:13px;padding:14px;background:var(--soft);border-radius:13px}.avatar{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:#dcd9ff;color:var(--brand);font-weight:800}.meter{height:8px;background:#e4e7ed;border-radius:20px;overflow:hidden}.meter i{display:block;width:46%;height:100%;background:var(--brand);border-radius:inherit}.empty{color:var(--muted);padding:20px 0}.note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
    @media(max-width:720px){.shell{padding:22px 14px 40px}.top{margin-bottom:24px}.grid{grid-template-columns:1fr}.card{padding:18px}.row{grid-template-columns:1fr}.hero h1{font-size:32px}.actions .btn{flex:1}.badge{white-space:nowrap}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand">声纹工坊</div><div class="badge">探索原型 · 模拟数据</div></header>
    <section class="hero"><h1>把你的声音，变成可复用的声音资产</h1><p>上传一段清晰的音频样本，设定声音风格，快速预览克隆结果。此页面仅用于讨论基础流程。</p></section>
    <section class="grid">
      <form class="card" id="cloneForm">
        <h2>创建声音</h2>
        <label class="drop" for="audioFile"><strong id="fileTitle">拖入音频，或点击选择文件</strong><small>支持 MP3 / WAV · 建议 10 秒以上</small><input id="audioFile" type="file" accept="audio/*"></label>
        <div class="field"><label for="voiceName">声音名称</label><input class="input" id="voiceName" placeholder="例如：播客旁白" maxlength="40"><div class="hint">名称只用于本次原型展示。</div></div>
        <div class="row"><div class="field"><label for="tone">克隆语气</label><select id="tone"><option>自然亲切</option><option>专业冷静</option><option>活泼有感染力</option></select></div><div class="field"><label for="language">语言</label><select id="language"><option>普通话</option><option>英语</option><option>粤语</option></select></div></div>
        <div class="actions"><button class="btn primary" id="generate" type="submit">开始生成克隆声音</button><button class="btn secondary" id="demoFail" type="button">模拟失败</button></div>
        <div class="status" id="status" role="status" aria-live="polite">准备就绪。选择音频后开始体验。</div>
      </form>
      <aside class="card result"><h2>结果预览</h2><div class="empty" id="resultEmpty">完成生成后，这里会出现可试听的声音卡片。</div><div id="resultCard" hidden><div class="voice"><div class="avatar">声</div><div><strong id="resultName">我的声音</strong><div class="hint">普通话 · 自然亲切</div></div></div><div class="meter"><i></i></div><button class="btn secondary" id="play" type="button">▶ 试听 00:12</button></div><div class="note">原型说明：生成过程为模拟，按钮会触发状态变化。</div></aside>
    </section>
  </main>
  <script>
    const form=document.querySelector('#cloneForm'), file=document.querySelector('#audioFile'), title=document.querySelector('#fileTitle'), status=document.querySelector('#status'), generate=document.querySelector('#generate'), fail=document.querySelector('#demoFail'), result=document.querySelector('#resultCard'), empty=document.querySelector('#resultEmpty'), name=document.querySelector('#voiceName'), resultName=document.querySelector('#resultName'), play=document.querySelector('#play');
    file.addEventListener('change',()=>{title.textContent=file.files[0]?file.files[0].name:'拖入音频，或点击选择文件';status.textContent=file.files[0]?'已选择音频，可以开始生成。':'准备就绪。选择音频后开始体验。';status.className='status'});
    function working(){generate.disabled=true;status.className='status';status.textContent='正在分析音色与语气…（模拟处理中）';setTimeout(()=>{generate.disabled=false;result.hidden=false;empty.hidden=true;resultName.textContent=name.value.trim()||'我的声音';status.className='status good';status.textContent='生成成功，可以试听克隆声音。'},1100)}
    form.addEventListener('submit',e=>{e.preventDefault();working()}); fail.addEventListener('click',()=>{generate.disabled=false;status.className='status bad';status.textContent='模拟失败：音频样本不够清晰，请更换文件后重试。'}); play.addEventListener('click',()=>{play.textContent=play.textContent.includes('试听')?'❚❚ 播放中…':'▶ 试听 00:12'});
  </script>
</body>
</html>
