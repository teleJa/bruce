# Agent test/verification environment contract. New profiles are unconfirmed by default.
version: 1
profile_kind: environment
profile_id: null
profile_revision: 1
content_hash: sha256:pending
profile_state: draft
confirmation:
  state: pending
  confirmed_by: null
  confirmed_at: null
  confirmed_revision: null
  confirmed_content_hash: null

declaration:
  source: user
  statement: null
  provided_at: null

project:
  name: null
  root: null

environment:
  name: null
  kind: null
  production: false
  shared: false
  purpose: null

# One compact context for everything an Agent needs to test and verify the project.
test_context:
  scope: local-development-and-integration-testing
  authorization:
    # One exact Profile confirmation authorizes the listed scopes for the Agent.
    mode: profile-confirmed
    approved_scopes: []
    escalation_required_for:
      - production-access
      - remote-deployment
      - database-drop
      - destructive-data-reset
      - credential-rotation
  workflow:
    build_operation: null
    deploy_operation: null
    test_data:
      prepare_operation: null
      cleanup_operation: null
      isolation: null
      strategy: null
    authenticate_operation: null
    test_operation: null
  services:
    application: []
    dependencies: []
    endpoints: []
  data:
    allowed_mutations: []
    prohibited_mutations:
      - database-drop
      - direct-sql
  authentication:
    account_pool: null
    credential_refs: []
    method: null
  configuration:
    env_file:
      path: .env
      required: false
      required_variables: []
      file_mode: "0600"
      ignored_by_vcs: required
    references: {}
  preflight: []

# One executable catalog. Routine entries may use authorization: profile-confirmed.
operations: []

freshness:
  basis: user-declaration-and-test-context
  invalidate_on:
    - user-declaration-change
    - environment-scope-change
    - test-context-change
    - endpoint-change
    - dependency-change
    - account-policy-change
    - credential-source-change
    - local-env-variable-scope-change
    - local-env-security-change
    - operation-set-change
  revalidation_required: true

security:
  persist_secrets: false
  expose_secrets_to_model: false
  redact_logs: true
  credential_values_allowed: false
  credential_refs_only: true
